# screenloop settings. After editing:  systemctl --user restart screenloop

[video]
# Must be H.264, 1080p or smaller, so the Pi's hardware decoder can play it.
file = ~/videos/display.mp4
# Optional: trim letterbox bars so the picture fills the screen, as
# width:height:x:y in the video's own pixels (e.g. 1280:530:0:97).
crop =
# Sound through the monitor's speakers. It always starts muted; unmute from the
# control page. Set to "no" to drop the soundtrack entirely.
audio = yes
# "auto" picks the Pi's HDMI output (its default is the headphone jack).
audio_device = auto
# New sessions start at a random point in the video.
random_start = yes
# Extra mpv options, space separated. Later options win, so this can also
# replace the built-in --vo and --hwdec (e.g. --scale=bilinear if playback stutters).
mpv_args =

[schedule]
# Each play lasts this many loops of the video, then the Pi's HDMI turns off.
loops = 2
# No automatic playback between these times (Play on the phone still works).
# Leave both empty for no quiet hours.
quiet_start = 23:00
quiet_end = 07:00
# Longest run for the "Keep playing" button.
keep_playing_hours = 10
# The daily schedule is set from the control page and saved in schedule.json.

[presence]
# The computer that shares the monitor, e.g. office-mac.local. The Pi pings it
# and steps aside while it's awake. Leave empty to play whenever the Pi is on
# (Mac helpers, if installed, still interrupt the video).
host =
interval = 2
# Unanswered pings in a row before the computer counts as asleep or off.
absent_after = 3
# A sleeping Mac's network chip still answers pings, but with TTL 32 (awake macOS
# uses 64). Replies at or below this TTL count as asleep.
asleep_ttl = 40
# Pings only: the computer must be awake this long before its next sleep
# restarts the video. macOS background "dark wakes" usually stop at about 3 minutes.
rearm_after_minutes = 4
# Pings only: right after sleeping, Macs often wake for ~20 s on their own.
# Within this many seconds of the computer sleeping, a wake must last
# confirm_wake_seconds before the video steps aside.
confirm_wake_window = 120
confirm_wake_seconds = 30
# The Mac helper (mac/install-mac.sh) reports when a Mac's screen turns on or off,
# every 10 s. A Mac whose helper goes quiet this many seconds counts as screen off.
helper_timeout = 35
# Once heard from, the helper on "host" is trusted over pings for this long, even
# across restarts. Delete ~/.config/screenloop/helpers.json to forget it sooner.
helper_memory_days = 7

[display]
# "auto" uses the first connected HDMI port; or name one, e.g. HDMI-A-1.
output = auto
# "auto" uses the monitor's preferred mode; or set one, e.g. 3840x1600. The
# highest refresh rate available at that size is used.
resolution = auto
# Losing the monitor on the HDMI port for this long while the video should show
# (e.g. switching the monitor off) stops the session, like pressing Stop.
monitor_off_seconds = 5

[monitor]
# Optional: a command that switches the monitor to the Pi's input, run when you
# press Play. For example "ddcutil setvcp 60 0x12", or "eizoctl -q -i HDMI2" for
# EIZO monitors. Leave empty if the monitor switches inputs by itself.
input_command =

[web]
port = 8080

[dashboard]
# Optional: a dashboard (clock, weather, news headlines, sun and moon) that
# replaces the video between these times every day, whenever no computer is
# using the screen. Leave both empty to switch it off. Needs Chromium.
start =
end =
# Weather comes from open-meteo.com for this place (no account needed).
place = London
latitude = 51.5074
longitude = -0.1278
# celsius or fahrenheit; mph, kmh, ms or kn.
temperature_unit = celsius
wind_unit = mph
# RSS or Atom feeds for the headlines panel, space separated, merged newest
# first. For example: https://feeds.bbci.co.uk/news/rss.xml
news_feeds =
news_title = Headlines
# "lite" drops the live glass blur, if the Pi can't draw it smoothly.
effects = full
# "auto" finds Chromium; or name the browser command. Extra options, space separated.
browser = auto
browser_args =
